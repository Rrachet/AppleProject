[workspace]
resolver = "3"
members = ["crates/xr-spike"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/Rrachet/AppleProject"

[workspace.dependencies]
openxr = "0.22"
ash = "0.38"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
